<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Farm Brawl – Vua Nông Trại</title>
  <meta name="description" content="Game .io nhiều người chơi: húc đối thủ vào hàng rào điện, chiếm bục và trở thành Vua Nông Trại.">
  <meta name="theme-color" content="#1f1a17">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23a5281b'/%3E%3Cpath d='M12 44 L16 22 L26 32 L32 16 L38 32 L48 22 L52 44 Z' fill='%23e8b641'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="menu">
  <canvas id="c"></canvas>

  <!-- Team mode: reign time per farm and match clock -->
  <div id="teamBar" hidden>
    <span class="tb tb0"><b data-i18n="team0">Foxwood</b><i id="ts0">0</i></span>
    <span id="tClock">5:00</span>
    <span class="tb tb1"><i id="ts1">0</i><b data-i18n="team1">Pinchfield</b></span>
  </div>

  <div id="hud" hidden>
    <header id="board" class="plank">
      <span class="eyebrow">★ ĐIỀU RĂN ★</span>
      <div class="paint"><span id="ruleName">MỌI CON VẬT ĐỀU BÌNH ĐẲNG</span></div>
      <small id="ruleDesc">Nhưng một số con vật bình đẳng hơn những con vật khác</small>
      <span id="reign" hidden>♛ 0:00</span>
    </header>

    <div id="stats" class="panel">
      <div class="weight"><b id="mass">20</b><span>kg</span></div>
      <div class="sub"><span id="rankTxt"></span> · <span id="koTxt"></span></div>
    </div>
    <aside id="lb" class="panel">
      <h3 data-i18n="lbTitle"></h3>
      <ol id="lbList"></ol>
      <div id="hof">
        <h3 class="eyebrow gold" data-i18n="hofTitle">Kỷ lục của trại</h3>
        <ol id="hofList"></ol>
      </div>
    </aside>
    <div id="mapWrap">
      <canvas id="minimap" width="160" height="160"></canvas>
      <div id="roomTag" hidden>Phòng 1</div>
    </div>
    <div id="feed"></div>
    <div id="capture" hidden><div id="capFill"></div><span id="capTxt"></span></div>
    <div id="ram"><div id="ramFill"></div><span id="ramTxt"></span></div>
    <button id="dashBtn" type="button" data-i18n="dash"></button>
    <div id="stick" hidden><div id="stickKnob"></div></div>
  </div>

  <div id="floats" aria-hidden="true"></div>
  <div id="banner" aria-live="polite"></div>
  <div id="toasts" aria-live="polite"></div>

  <!-- King commandment cards selection overlay -->
  <div id="choice" hidden>
    <h3><span data-i18n="choiceTitle">Napoleon, hãy sửa một điều răn</span> <span id="choiceLeft"></span></h3>
    <div id="choiceCards"></div>
  </div>

  <div id="start" class="screen">
    <div class="card">
      <div class="wall-top">
        <button id="mute" type="button" title="M"><span class="ico">🔊</span> <span data-i18n="sound">Âm thanh</span></button>
      </div>
      <h1><span class="t1">FARM</span><span class="t2">BRAWL</span></h1>
      <p class="slogan" data-i18n="slogan"></p>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false">
      <p class="eyebrow" data-i18n="modeLabel">Chế độ chơi</p>
      <div id="modes">
        <button type="button" class="on" data-mode="ffa"><span class="n">Tự do</span><span class="p">Ai lo thân nấy</span></button>
        <button type="button" data-mode="team"><span class="n">Trại đấu trại</span><span class="p">Foxwood đấu Pinchfield</span></button>
      </div>
      <p class="label" data-i18n="pick"></p>
      <div id="species"></div>
      <p id="speciesHint" class="hint"></p>
      <button id="play" class="btn-red" type="button" data-i18n="play"></button>
      <p id="bestLine"></p>
      <ul class="how">
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
      </ul>
      <p class="mode-note" data-i18n="offlineNote"></p>
    </div>
  </div>

  <div id="death" class="screen" hidden>
    <div class="card notice">
      <div id="deathTitle" class="stamp"></div>
      <p id="deathCause"></p>
      <div class="deathStats">
        <div><b id="dMass">0</b><span data-i18n="stKg"></span></div>
        <div><b id="dKills">0</b><span data-i18n="stKo"></span></div>
        <div><b id="dTime">0:00</b><span data-i18n="stTime"></span></div>
      </div>
      <p id="deathBest"></p>
      <button id="again" class="btn-red" type="button" data-i18n="again"></button>
      <button id="change" class="btn-ghost" type="button" data-i18n="change"></button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
